<div class="board" role="grid" aria-label="Dama board">
  <div class="squares">
    @for (cell of cells(); track cell.key) {
      @if (cell.playable) {
        <button
          type="button"
          class="square"
          [class.selected]="cell.selected"
          [class.on-path]="cell.onPath"
          [class.last-move]="cell.isLastMove"
          [attr.data-square]="cell.name"
          [attr.aria-label]="'Square ' + cell.name"
          (click)="tap(cell)"
        >
          @if (cell.isCompulsoryRing) {
            <span class="ring compulsory-ring" aria-hidden="true"></span>
          }
          @if (cell.isCaptureRing) {
            <span class="ring capture-ring" aria-hidden="true"></span>
          }
          @if (cell.isLandingDot) {
            <span class="dot" aria-hidden="true"></span>
          }
          <ng-container *ngTemplateOutlet="coordinates; context: { $implicit: cell }" />
        </button>
      } @else {
        <div class="square filler" aria-hidden="true">
          <ng-container *ngTemplateOutlet="coordinates; context: { $implicit: cell }" />
        </div>
      }
    }
  </div>

  <div class="pieces-layer" aria-hidden="true">
    @for (piece of pieces(); track piece.id) {
      <span
        class="piece"
        [class.captured]="piece.captured"
        [class.lifted]="piece.lifted"
        [style.transition-duration.ms]="piece.hopMs ?? null"
        [style.top.%]="piece.top"
        [style.left.%]="piece.left"
        data-testid="piece"
        [attr.data-square]="squareNameFor(piece.square)"
        [attr.data-color]="piece.color"
        [attr.data-king]="piece.king ? 'true' : 'false'"
      >
        <span class="piece-disc" [attr.data-color]="piece.color">
          @if (piece.king) {
            <span class="king-star" aria-hidden="true"></span>
          }
        </span>
      </span>
    }
  </div>
</div>

<!-- Rank numbers down the left edge, file letters along the bottom, as the board is drawn. -->
<ng-template #coordinates let-cell>
  @if (cell.rankLabel) {
    <span class="coord coord-rank" aria-hidden="true">{{ cell.rankLabel }}</span>
  }
  @if (cell.fileLabel) {
    <span class="coord coord-file" aria-hidden="true">{{ cell.fileLabel }}</span>
  }
</ng-template>
