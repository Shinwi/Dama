name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Pushes the build to the gh-pages branch, which needs write access to the repo contents.
permissions:
  contents: write

# Only one master deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Served from https://<owner>.github.io/<repo>/, so the base path is the repo name.
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Without this, GitHub Pages runs the site through Jekyll, which drops files starting
      # with an underscore.
      - run: touch dist/web/browser/.nojekyll

      # Replaces the root of gh-pages with the new build, but leaves pr-preview/ (the
      # per-PR previews from pr-preview.yml) untouched.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/dist/web/browser
          branch: gh-pages
          clean-exclude: pr-preview/
