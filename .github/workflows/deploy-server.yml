name: Online server

# Tests the online server (server/) on pull requests, and on master also deploys it to Fly.io.
# Runs only when something the server is built from changes: server/, the engine and message
# types it bundles from web/src/, or fly.toml.
on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "web/src/engine/**"
      - "web/src/protocol/**"
      - "fly.toml"
      - ".dockerignore"
      - ".github/workflows/deploy-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/src/engine/**"
      - "web/src/protocol/**"
      - "fly.toml"
      - ".dockerignore"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    # Pull requests are only tested; master (or a manual run) deploys.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancelled half-way.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      # Until the FLY_API_TOKEN secret is added (see server/README.md), skip the deploy with a
      # notice rather than failing master.
      - id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set: skipping the deploy. See server/README.md, 'Hosting on Fly.io'."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'

      # --ha=false: exactly one machine, since rooms live in its memory. Deploying restarts
      # it, which ends any games in progress.
      - run: flyctl deploy --remote-only --ha=false
        if: steps.token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
